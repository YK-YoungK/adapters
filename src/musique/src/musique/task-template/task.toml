version = "1.0"
artifacts = ["/workspace/prediction.json"]

[task]
name = "musique/{task_id}"
authors = [
    { name = "Harsh Trivedi" },
    { name = "Niranjan Balasubramanian" },
    { name = "Tushar Khot" },
    { name = "Ashish Sabharwal" },
]

[metadata]
difficulty = "hard"
category = "question-answering"
tags = ["multi-hop", "reading-comprehension", "supporting-paragraphs"]
benchmark = "MuSiQue-{variant}"
split = "{split}"
upstream_revision = "{upstream_revision}"
source_sha256 = "{data_sha256}"

[agent]
timeout_sec = 600.0

[verifier]
environment_mode = "separate"
timeout_sec = 180.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
