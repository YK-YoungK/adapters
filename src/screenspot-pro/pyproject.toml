[project]
name = "harbor-screenspot-pro-adapter"
version = "0.1.0"
description = "Harbor adapter for the ScreenSpot-Pro GUI grounding benchmark"
readme = "README.md"
authors = [{ name = "yk", email = "yangkai@umich.edu" }]
requires-python = ">=3.11"
dependencies = ["huggingface-hub>=0.34,<2", "pillow>=11,<13"]

[project.scripts]
screenspot-pro = "screenspot_pro.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screenspot_pro"]
