version = "1.0"

[task]
name = "$task_name"
authors = [
    { name = "Kaixin Li", email = "likaixin@u.nus.edu" },
    { name = "Ziyang Meng" },
    { name = "Hongzhan Lin" },
    { name = "Ziyang Luo" },
    { name = "Yuchen Tian" },
    { name = "Jing Ma" },
    { name = "Zhiyong Huang" },
    { name = "Tat-Seng Chua" },
]

[metadata]
difficulty = "hard"
category = "gui-grounding"
tags = ["screenspot-pro", "vision", "gui", "grounding"]
upstream_id = "$upstream_id"
language = "$language"
application = "$application"
platform = "$platform"
ui_type = "$ui_type"
group = "$group"
dataset_revision = "$dataset_revision"
upstream_revision = "$upstream_revision"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 30.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 2048
